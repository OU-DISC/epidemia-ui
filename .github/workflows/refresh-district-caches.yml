name: Refresh District Forecast Caches

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload district_forecasts.tar.gz to the epidemia-forecast-data release
        type: boolean
        default: true
      upload_report:
        description: Also upload report_data.json.gz (for future CI refreshes)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch report_data.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/fetch-report-data.sh

      - name: Build district cache files
        run: python backend/scripts/prepare_district_caches.py

      - name: Package district caches
        run: bash .github/scripts/package-district-caches.sh

      - name: Compress report for release storage
        if: inputs.upload_report
        run: gzip -c backend/report/report_data.json > report_data.json.gz

      - name: Upload GitHub release assets
        if: inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/upload-district-caches-release.sh

      - name: Save district caches to Actions cache
        uses: actions/cache/save@v4
        with:
          path: |
            public/district_forecasts
            backend/report/district_forecasts
          key: epidemia-district-caches-${{ hashFiles('public/report_bootstrap.json') }}

      - name: Summary
        run: |
          count="$(find public/district_forecasts backend/report/district_forecasts -name '*.json' | wc -l | tr -d ' ')"
          echo "District cache files ready: $count"
          echo "Actions cache key: epidemia-district-caches-${{ hashFiles('public/report_bootstrap.json') }}"
