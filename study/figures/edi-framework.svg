<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
  <title id="title">Explainable Decision Intelligence framework</title>
  <desc id="desc">EDI mechanisms map to design goals, EPIDEMIA, user-study findings, and design principles.</desc>

  <defs>
    <style>
      .title {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: #1d2738;
        letter-spacing: 0.04em;
      }
      .box {
        fill: #ffffff;
        stroke: #1d2738;
        stroke-width: 1.5;
      }
      .box-accent {
        fill: #f4f7f6;
        stroke: #0f7b6c;
        stroke-width: 1.75;
      }
      .box-soft {
        fill: #f7f8fa;
        stroke: #4c5a70;
        stroke-width: 1.25;
      }
      .label {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #1d2738;
        text-anchor: middle;
      }
      .sub {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #4c5a70;
        text-anchor: middle;
      }
      .edge {
        stroke: #4c5a70;
        stroke-width: 1.5;
        fill: none;
      }
      .arrow {
        fill: #4c5a70;
      }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path class="arrow" d="M0,0 L6,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- EDI title -->
  <rect class="box-accent" x="160" y="24" width="400" height="48" rx="8"/>
  <text class="title" x="360" y="54" text-anchor="middle">EXPLAINABLE DECISION INTELLIGENCE</text>

  <!-- trunk down from EDI -->
  <line class="edge" x1="360" y1="72" x2="360" y2="100" marker-end="url(#arrow)"/>

  <!-- splitter to three mechanisms -->
  <path class="edge" d="M140 118 H580"/>
  <line class="edge" x1="360" y1="100" x2="360" y2="118"/>
  <line class="edge" x1="140" y1="118" x2="140" y2="136" marker-end="url(#arrow)"/>
  <line class="edge" x1="360" y1="118" x2="360" y2="136" marker-end="url(#arrow)"/>
  <line class="edge" x1="580" y1="118" x2="580" y2="136" marker-end="url(#arrow)"/>

  <!-- Mechanisms -->
  <rect class="box" x="55" y="140" width="170" height="44" rx="6"/>
  <text class="label" x="140" y="167">Explainability</text>

  <rect class="box" x="275" y="140" width="170" height="44" rx="6"/>
  <text class="label" x="360" y="167">Uncertainty</text>

  <rect class="box" x="495" y="140" width="170" height="44" rx="6"/>
  <text class="label" x="580" y="167">Workflow</text>

  <!-- to DGs -->
  <line class="edge" x1="140" y1="184" x2="140" y2="208" marker-end="url(#arrow)"/>
  <line class="edge" x1="360" y1="184" x2="360" y2="208" marker-end="url(#arrow)"/>
  <line class="edge" x1="580" y1="184" x2="580" y2="208" marker-end="url(#arrow)"/>

  <!-- Design goals -->
  <rect class="box-soft" x="70" y="212" width="140" height="52" rx="6"/>
  <text class="label" x="140" y="234">DG1</text>
  <text class="sub" x="140" y="252">Explain reasoning</text>

  <rect class="box-soft" x="290" y="212" width="140" height="52" rx="6"/>
  <text class="label" x="360" y="234">DG2</text>
  <text class="sub" x="360" y="252">Calibrate trust</text>

  <rect class="box-soft" x="510" y="212" width="140" height="52" rx="6"/>
  <text class="label" x="580" y="234">DG3</text>
  <text class="sub" x="580" y="252">Progressive decisions</text>

  <!-- converge to EPIDEMIA -->
  <line class="edge" x1="140" y1="264" x2="140" y2="292"/>
  <line class="edge" x1="360" y1="264" x2="360" y2="292"/>
  <line class="edge" x1="580" y1="264" x2="580" y2="292"/>
  <path class="edge" d="M140 292 H580"/>
  <line class="edge" x1="360" y1="292" x2="360" y2="312" marker-end="url(#arrow)"/>

  <rect class="box-accent" x="220" y="316" width="280" height="48" rx="8"/>
  <text class="title" x="360" y="338" text-anchor="middle" style="font-size:16px;">EPIDEMIA 2.0</text>
  <text class="sub" x="360" y="356">EDI system instantiation</text>

  <line class="edge" x1="360" y1="364" x2="360" y2="392" marker-end="url(#arrow)"/>

  <rect class="box" x="250" y="396" width="220" height="40" rx="6"/>
  <text class="label" x="360" y="421">USER STUDY</text>

  <line class="edge" x1="360" y1="436" x2="360" y2="456"/>
  <path class="edge" d="M140 456 H580"/>
  <line class="edge" x1="140" y1="456" x2="140" y2="472" marker-end="url(#arrow)"/>
  <line class="edge" x1="360" y1="456" x2="360" y2="472" marker-end="url(#arrow)"/>
  <line class="edge" x1="580" y1="456" x2="580" y2="472" marker-end="url(#arrow)"/>

  <!-- Findings -->
  <rect class="box-soft" x="70" y="476" width="140" height="52" rx="6"/>
  <text class="label" x="140" y="498">F1</text>
  <text class="sub" x="140" y="516">Understanding</text>

  <rect class="box-soft" x="290" y="476" width="140" height="52" rx="6"/>
  <text class="label" x="360" y="498">F2</text>
  <text class="sub" x="360" y="516">Calibration</text>

  <rect class="box-soft" x="510" y="476" width="140" height="52" rx="6"/>
  <text class="label" x="580" y="498">F3</text>
  <text class="sub" x="580" y="516">Intervention decisions</text>

  <!-- to principles banner -->
  <line class="edge" x1="140" y1="528" x2="140" y2="544"/>
  <line class="edge" x1="360" y1="528" x2="360" y2="544"/>
  <line class="edge" x1="580" y1="528" x2="580" y2="544"/>
  <path class="edge" d="M140 544 H580"/>
  <line class="edge" x1="360" y1="544" x2="360" y2="560" marker-end="url(#arrow)"/>

  <rect class="box-accent" x="210" y="564" width="300" height="36" rx="8"/>
  <text class="title" x="360" y="587" text-anchor="middle" style="font-size:14px;">EDI DESIGN PRINCIPLES</text>

  <line class="edge" x1="360" y1="600" x2="360" y2="612"/>
  <path class="edge" d="M140 612 H580"/>
  <line class="edge" x1="140" y1="612" x2="140" y2="624" marker-end="url(#arrow)"/>
  <line class="edge" x1="360" y1="612" x2="360" y2="624" marker-end="url(#arrow)"/>
  <line class="edge" x1="580" y1="612" x2="580" y2="624" marker-end="url(#arrow)"/>

  <rect class="box-soft" x="55" y="628" width="170" height="40" rx="6"/>
  <text class="label" x="140" y="646" style="font-size:12px;">DP1 Explain decisions</text>

  <rect class="box-soft" x="275" y="628" width="170" height="40" rx="6"/>
  <text class="label" x="360" y="646" style="font-size:12px;">DP2 Uncertainty actionable</text>

  <rect class="box-soft" x="495" y="628" width="170" height="40" rx="6"/>
  <text class="label" x="580" y="646" style="font-size:12px;">DP3 Decision workflows</text>
</svg>
