<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="720" viewBox="0 0 520 720" role="img" aria-labelledby="title desc">
  <title id="title">EDI interaction model</title>
  <desc id="desc">AI-generated evidence flows through Interpret, Deliberate, and Challenge to human judgment: Confirm, Override, or Annotate.</desc>

  <defs>
    <style>
      .h {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #1d2738;
        text-anchor: middle;
      }
      .stage {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #1d2738;
        text-anchor: middle;
        letter-spacing: 0.04em;
      }
      .item {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #4c5a70;
        text-anchor: middle;
      }
      .act {
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #1d2738;
        text-anchor: middle;
      }
      .box {
        fill: #ffffff;
        stroke: #1d2738;
        stroke-width: 1.4;
      }
      .box-top {
        fill: #f7f8fa;
        stroke: #4c5a70;
        stroke-width: 1.25;
      }
      .box-stage {
        fill: #f4f7f6;
        stroke: #0f7b6c;
        stroke-width: 1.55;
      }
      .box-human {
        fill: #eef3f2;
        stroke: #0f7b6c;
        stroke-width: 1.7;
      }
      .edge {
        stroke: #4c5a70;
        stroke-width: 1.5;
        fill: none;
      }
      .arrow { fill: #4c5a70; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path class="arrow" d="M0,0 L6,3 L0,6 Z"/>
    </marker>
  </defs>

  <!-- AI-GENERATED EVIDENCE -->
  <rect class="box-top" x="130" y="20" width="260" height="40" rx="7"/>
  <text class="h" x="260" y="45">AI-GENERATED EVIDENCE</text>

  <line class="edge" x1="260" y1="60" x2="260" y2="80" marker-end="url(#arrow)"/>

  <!-- INTERPRET -->
  <rect class="box-stage" x="110" y="82" width="300" height="110" rx="8"/>
  <text class="stage" x="260" y="106">INTERPRET</text>
  <text class="item" x="260" y="128">Why this alert?</text>
  <text class="item" x="260" y="146">Supporting evidence</text>
  <text class="item" x="260" y="164">Contradicting evidence</text>

  <line class="edge" x1="260" y1="192" x2="260" y2="212" marker-end="url(#arrow)"/>

  <!-- DELIBERATE -->
  <rect class="box-stage" x="110" y="214" width="300" height="128" rx="8"/>
  <text class="stage" x="260" y="238">DELIBERATE</text>
  <text class="item" x="260" y="260">Alternatives</text>
  <text class="item" x="260" y="278">Trade-offs</text>
  <text class="item" x="260" y="296">Context</text>
  <text class="item" x="260" y="314">What could change?</text>

  <line class="edge" x1="260" y1="342" x2="260" y2="362" marker-end="url(#arrow)"/>

  <!-- CHALLENGE -->
  <rect class="box-stage" x="110" y="364" width="300" height="146" rx="8"/>
  <text class="stage" x="260" y="388">CHALLENGE</text>
  <text class="item" x="260" y="410">Counter-evidence</text>
  <text class="item" x="260" y="428">Evidence gaps</text>
  <text class="item" x="260" y="446">Model limitations</text>
  <text class="item" x="260" y="464">"Why might this assessment be wrong?"</text>

  <line class="edge" x1="260" y1="510" x2="260" y2="534" marker-end="url(#arrow)"/>

  <!-- HUMAN JUDGMENT -->
  <rect class="box-human" x="130" y="536" width="260" height="40" rx="7"/>
  <text class="h" x="260" y="561">HUMAN JUDGMENT</text>

  <line class="edge" x1="260" y1="576" x2="260" y2="598"/>
  <line class="edge" x1="110" y1="598" x2="410" y2="598"/>
  <line class="edge" x1="110" y1="598" x2="110" y2="612" marker-end="url(#arrow)"/>
  <line class="edge" x1="260" y1="598" x2="260" y2="612" marker-end="url(#arrow)"/>
  <line class="edge" x1="410" y1="598" x2="410" y2="612" marker-end="url(#arrow)"/>

  <rect class="box" x="55" y="614" width="110" height="34" rx="6"/>
  <text class="act" x="110" y="636">Confirm</text>

  <rect class="box" x="205" y="614" width="110" height="34" rx="6"/>
  <text class="act" x="260" y="636">Override</text>

  <rect class="box" x="355" y="614" width="110" height="34" rx="6"/>
  <text class="act" x="410" y="636">Annotate</text>
</svg>
